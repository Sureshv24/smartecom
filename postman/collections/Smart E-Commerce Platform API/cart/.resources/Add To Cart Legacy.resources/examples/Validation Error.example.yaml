$kind: http-example
request:
  url: "{{baseUrl}}/cart"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "product_id": 3345,
        "quantity": 1
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": [
          {
            "loc": [
              3641,
              "string"
            ],
            "msg": "string",
            "type": "string",
            "input": "",
            "ctx": {}
          },
          {
            "loc": [
              3208,
              3502
            ],
            "msg": "string",
            "type": "string",
            "input": "",
            "ctx": {}
          }
        ]
      }
order: 2000
