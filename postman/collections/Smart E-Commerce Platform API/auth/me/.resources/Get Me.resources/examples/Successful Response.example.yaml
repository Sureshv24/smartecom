$kind: http-example
request:
  url: "{{baseUrl}}/auth/me"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 1765,
        "name": "string",
        "email": "2rkGdEDl@oWHgixoTsrAYkW.ur",
        "role": "string"
      }
order: 1000
