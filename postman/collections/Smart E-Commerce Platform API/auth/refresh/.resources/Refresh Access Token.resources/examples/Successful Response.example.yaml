$kind: http-example
request:
  url: "{{baseUrl}}/auth/refresh"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "refresh_token": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "access_token": "string",
        "token_type": "bearer"
      }
order: 1000
