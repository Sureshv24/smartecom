$kind: http-example
request:
  url: "{{baseUrl}}/notifications/read"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "notification_id": 3053
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 2920,
        "user_id": 6908,
        "type": "string",
        "message": "string",
        "read_status": "string",
        "timestamp": "2023-12-13T20:47:31.561Z"
      }
order: 1000
